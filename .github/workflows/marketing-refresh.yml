name: Marketing Content Refresh

on:
  schedule:
    # Run daily at 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch: {}

jobs:
  refresh-marketing-snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate daily social snippet
        run: |
          python scripts/generate_snippet.py
          python scripts/build_social_drafts.py

      - name: Commit updated marketing drafts
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add marketing/auto/daily_snippet.md marketing/auto/daily_drafts.json || true
          git diff --cached --quiet || git commit -m "chore: refresh daily marketing snippets"
          git push || true
